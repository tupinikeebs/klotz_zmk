# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse support
CONFIG_ZMK_POINTING=y

# Azoteq TPS43 trackpad on the RIGHT (peripheral) half (vendored driver in
# drivers/input/, see config/boards/shields/klotz/klotz_right.overlay).
# CONFIG_ZMK_INPUT_SPLIT auto-enables from the input-split DT nodes.
# CONFIG_I2C is required by the TPS43 driver and must be set explicitly here:
# unlike the Sofle (which pulled it in via the OLED display), KLOTZ has no OLED,
# so nothing else enables I2C. Without it INPUT_TPS43 stays off and the &trackpad
# device is missing -> input_split fails to link (undefined __device_dts_ord).


CONFIG_ZMK_SPLIT_ROLE_CENTRAL_MASTER=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_TPS43=y

# Better connection and power on bt
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
